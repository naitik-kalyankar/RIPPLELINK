services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kickmanager
      POSTGRES_PASSWORD: kickmanager
      POSTGRES_DB: kickmanager
    ports:
      - "5432:5432"
    volumes:
      - kickmanager_pgdata:/var/lib/postgresql/data

volumes:
  kickmanager_pgdata:
